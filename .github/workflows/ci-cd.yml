name: Angular CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Ajusta a la versión que utilices localmente

    - name: Instalar dependencias
      run: npm ci

    - name: Compilar proyecto para producción
      run: npm run build --configuration production

    - name: Subir artefacto compilado
      uses: actions/upload-artifact@v4
      with:
        name: angular-dist
        path: dist/fenomeno-nino # Verifica si tu angular.json saca los archivos a 'dist/' o 'dist/tu-proyecto'
